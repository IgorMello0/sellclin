# ╔══════════════════════════════════════════════════════════════╗
# ║  SellClin — Docker Swarm Stack (Traefik + HTTPS)            ║
# ║                                                              ║
# ║  Deploy:                                                     ║
# ║    docker stack deploy -c docker-stack.yml sellclin           ║
# ║                                                              ║
# ║  Remover:                                                    ║
# ║    docker stack rm sellclin                                   ║
# ╚══════════════════════════════════════════════════════════════╝

version: "3.8"

services:
  app:
    image: sellclin:latest
    networks:
      - network_public
    volumes:
      # Bind mount: arquivos persistem em /opt/docker/data/sellclin/uploads
      # mesmo ao recriar ou atualizar o container
      - /opt/docker/data/sellclin/uploads:/app/uploads
    environment:
      # ─── Banco de Dados ───
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      # ─── Autenticação ───
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CALENDAR_CLIENT_ID=${GOOGLE_CALENDAR_CLIENT_ID}
      - GOOGLE_CALENDAR_CLIENT_SECRET=${GOOGLE_CALENDAR_CLIENT_SECRET}
      - GOOGLE_CALENDAR_REDIRECT_URI=${GOOGLE_CALENDAR_REDIRECT_URI}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - ABACATEPAY_API_KEY=${ABACATEPAY_API_KEY}
      - ABACATEPAY_WEBHOOK_SECRET=${ABACATEPAY_WEBHOOK_SECRET}
      - ABACATEPAY_API_BASE_URL=${ABACATEPAY_API_BASE_URL}
      - ABACATEPAY_START_MONTHLY_PRODUCT_ID=${ABACATEPAY_START_MONTHLY_PRODUCT_ID}
      - ABACATEPAY_START_YEARLY_PRODUCT_ID=${ABACATEPAY_START_YEARLY_PRODUCT_ID}
      - ABACATEPAY_PRO_MONTHLY_PRODUCT_ID=${ABACATEPAY_PRO_MONTHLY_PRODUCT_ID}
      - ABACATEPAY_PRO_YEARLY_PRODUCT_ID=${ABACATEPAY_PRO_YEARLY_PRODUCT_ID}
      - ABACATEPAY_ENTERPRISE_MONTHLY_PRODUCT_ID=${ABACATEPAY_ENTERPRISE_MONTHLY_PRODUCT_ID}
      - ABACATEPAY_ENTERPRISE_YEARLY_PRODUCT_ID=${ABACATEPAY_ENTERPRISE_YEARLY_PRODUCT_ID}
      - ABACATEPAY_ALLOW_SHARED_PRODUCT_IDS=${ABACATEPAY_ALLOW_SHARED_PRODUCT_IDS}
      - ABACATEPAY_EXTRA_CLINIC_MONTHLY_PRODUCT_ID=${ABACATEPAY_EXTRA_CLINIC_MONTHLY_PRODUCT_ID}
      - ABACATEPAY_EXTRA_CLINIC_YEARLY_PRODUCT_ID=${ABACATEPAY_EXTRA_CLINIC_YEARLY_PRODUCT_ID}
      - ABACATEPAY_EXTRA_USER_MONTHLY_PRODUCT_ID=${ABACATEPAY_EXTRA_USER_MONTHLY_PRODUCT_ID}
      - ABACATEPAY_EXTRA_USER_YEARLY_PRODUCT_ID=${ABACATEPAY_EXTRA_USER_YEARLY_PRODUCT_ID}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      - META_WHATSAPP_CONFIG_ID=${META_WHATSAPP_CONFIG_ID}
      - META_WHATSAPP_COEXISTENCE_CONFIG_ID=${META_WHATSAPP_COEXISTENCE_CONFIG_ID}
      - META_WHATSAPP_REDIRECT_URI=${META_WHATSAPP_REDIRECT_URI}
      - META_GRAPH_VERSION=${META_GRAPH_VERSION}
      - WHATSAPP_COEXISTENCE_ENABLED=${WHATSAPP_COEXISTENCE_ENABLED}
      - WHATSAPP_COEXISTENCE_TEST_EMAILS=${WHATSAPP_COEXISTENCE_TEST_EMAILS}
      - UAZAPI_API_URL=${UAZAPI_API_URL}
      - UAZAPI_ADMIN_TOKEN=${UAZAPI_ADMIN_TOKEN}
      # ─── Runtime ───
      - NODE_ENV=production
      - PORT=4000
      - RUN_PRISMA_DB_PUSH=false
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      labels:
        # ─── Traefik: Ativar ───
        - "traefik.enable=true"

        # ─── Traefik: Serviço (porta interna do container) ───
        - "traefik.http.services.sellclin.loadbalancer.server.port=80"

        # ─── Traefik: Rota principal (sellclin.com) ───
        - "traefik.http.routers.sellclin.rule=Host(`sellclin.com`)"
        - "traefik.http.routers.sellclin.entrypoints=websecure"
        - "traefik.http.routers.sellclin.tls.certresolver=letsencrypt"
        - "traefik.http.routers.sellclin.service=sellclin"

        # ─── Traefik: Rota WWW (www.sellclin.com → redirect 301) ───
        - "traefik.http.routers.sellclin-www.rule=Host(`www.sellclin.com`)"
        - "traefik.http.routers.sellclin-www.entrypoints=websecure"
        - "traefik.http.routers.sellclin-www.tls.certresolver=letsencrypt"
        - "traefik.http.routers.sellclin-www.service=sellclin"
        - "traefik.http.routers.sellclin-www.middlewares=sellclin-www-redirect"

        # ─── Traefik: Middleware de redirect www → raiz ───
        - "traefik.http.middlewares.sellclin-www-redirect.redirectregex.regex=^https://www\\.sellclin\\.com/(.*)"
        - "traefik.http.middlewares.sellclin-www-redirect.redirectregex.replacement=https://sellclin.com/$${1}"
        - "traefik.http.middlewares.sellclin-www-redirect.redirectregex.permanent=true"

# ─── IMPORTANTE ───────────────────────────────────────────────
# Verifique o nome da rede Traefik na sua VPS com:
#   docker network ls | grep -i traefik
# Se o nome for diferente de "network_public", altere abaixo.
# ──────────────────────────────────────────────────────────────
networks:
  network_public:
    external: true
