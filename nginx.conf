# ═══════════════════════════════════════════════════════════
# SalesClin — Nginx Config (interno do container Docker)
# Serve frontend estático + proxy reverso para backend Node
# ═══════════════════════════════════════════════════════════

# Omit query strings and redact webhook paths: they contain OAuth codes,
# signed media credentials or clinic webhook tokens.
map $uri $security_log_uri {
    default $uri;
    ~^/api/webhooks/ /api/webhooks/[redacted];
}
log_format security '$remote_addr - [$time_local] "$request_method $security_log_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;

    root /app/dist;
    index index.html;

    # ─── Gzip ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # ─── Security Headers ───
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Backend API (proxy para Node.js na porta 4000) ───
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 40M;
    }

    # ─── Uploads (servidos pelo Express) ───
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    # ─── Assets estáticos com cache longo ───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Frontend SPA (fallback para index.html) ───
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files $uri /index.html;
    }

    # ─── Logs ───
    access_log /var/log/nginx/sellclin-access.log security;
    error_log  /var/log/nginx/sellclin-error.log warn;
}
